; PlatformIO — Detector Acústico de bem-te-vi (ESP32 + FreeRTOS)
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor -b 115200
;
; Fixamos a versão da plataforma para usar o arduino-esp32 2.0.x, cujo driver
; I2S legado (driver/i2s.h) e a API LEDC (ledcSetup/ledcAttachPin/ledcWriteTone)
; usados neste projeto são estáveis e compatíveis com o Wokwi.

[env:esp32dev]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -I include
    ; WOKWI_SIM=1 gera o áudio internamente (para testar no Wokwi sem microfone).
    ; Para hardware real com INMP441, troque para -D WOKWI_SIM=0
    -D WOKWI_SIM=1
